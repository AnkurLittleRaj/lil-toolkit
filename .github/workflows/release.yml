name: Publish public packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run release:check
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/*.tgz
  github-packages:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ankurlittleraj'
      - run: npm ci
      - run: npm run build
      - run: npm run release:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  npm:
    needs: validate
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run release:npm
        env:
          # Optional bootstrap token; after trusted publisher setup, OIDC needs no token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
